[dependency-groups]
dev = [
    "mypy==1.14",
    "invoke>=2,<3",
    "pytest>=8,<9",
    "twine",
    "pytest-cov",
    "ruff==0.8.4",
    "setuptools",
]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
disallow_untyped_defs = true
