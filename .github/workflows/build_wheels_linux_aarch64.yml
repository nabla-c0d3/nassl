# Workflow just for linux aarch64 wheels so it can run in parallel with the build_wheels workflow 
name: Build aarch64 Wheels

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

jobs:
  build_wheels:
    name: Build aarch64 wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04-arm]  # Native runner: under QEMU, the OpenSSL 4 build exceeds the 6-hour job limit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=4.3.1,<4.4"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_ARCHS_LINUX: aarch64  # Specifically build linux aarch64 wheels
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          # OpenSSL 4 needs some perl libraries, not installed on manylinux2014 (see build_wheels.yml)
          CIBW_BEFORE_ALL: "(command -v yum > /dev/null 2>&1 && yum install -y perl-IPC-Cmd perl-Time-Piece || true) && python -m pip install setuptools invoke && invoke build.deps"
          CIBW_BEFORE_BUILD: "python -m pip install setuptools invoke && invoke build.nassl"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "python -m pytest {project}/tests"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-wheels
          path: ./wheelhouse/*.whl
